name: Release Velle.Blazor

on:
  push:
    tags: ['blazor-v[0-9]*']

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check the tag against the package version
        shell: bash
        run: |
          version=$(dotnet msbuild src/Velle.Blazor/Velle.Blazor.csproj -nologo -p:Configuration=Release -getProperty:PackageVersion)
          if [[ "$GITHUB_REF_NAME" != "blazor-v$version" ]]; then
            printf 'Expected tag blazor-v%s for Velle.Blazor, got %s\n' "$version" "$GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test .NET solution
        run: |
          dotnet build Velle.slnx -c Release
          dotnet test Velle.slnx -c Release --no-build
      - run: npm ci
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:blazor
      - run: dotnet pack src/Velle.Blazor -c Release --no-build -o bin/nuget
      - uses: actions/upload-artifact@v4
        with:
          name: velle-blazor
          path: bin/nuget/Velle.Blazor.*.nupkg
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: velle-blazor
          path: bin/nuget
      - name: Sign in to NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish Velle.Blazor to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'bin/nuget/Velle.Blazor.*.nupkg' --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
