<button type="button" class="btn" commandfor="sheet_right" command="show-modal">Open</button>

<dialog id="sheet_right" class="sheet sheet--right" data-dialog data-dialog-action="click->closeOnClickOutside" aria-labelledby="sheet_right_title" aria-describedby="sheet_right_text">
  <button type="button" class="btn btn--plain sheet__close" commandfor="sheet_right" command="close">
    <span class="icon icon--x" aria-hidden="true"></span>
    <span class="sr-only">Close</span>
  </button>

  <form class="sheet__content flex flex-col gap" action="/profile" method="post">
    <div class="flex flex-col">
      <h3 class="font-medium leading-none mbe-1" id="sheet_right_title">Edit profile</h3>
      <p class="text-sm text-subtle" id="sheet_right_text">Make changes to your profile here. Click save when you're done.</p>
    </div>

    <div class="flex-1 flex flex-col gap">
      <div class="flex flex-col gap-half">
        <label class="text-sm font-medium leading-none" for="sheet_name">Name</label>
        <input value="Ada Lovelace" class="input" autofocus type="text" name="name" id="sheet_name">
      </div>

      <div class="flex flex-col gap-half">
        <label class="text-sm font-medium leading-none" for="sheet_username">Username</label>
        <input value="@ada" class="input" type="text" name="username" id="sheet_username">
      </div>
    </div>

    <div class="flex flex-col gap-half">
      <button type="submit" class="btn btn--primary">Save changes</button>
      <button type="button" class="btn" commandfor="sheet_right" command="close">Close</button>
    </div>
  </form>
</dialog>
