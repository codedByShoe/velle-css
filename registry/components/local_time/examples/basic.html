<dl class="flex flex-col gap-half text-sm" id="local_time_demo">
  <div class="flex gap"><dt class="font-medium" style="min-inline-size: 6rem">time</dt><dd><time datetime="2026-10-11T22:20:21Z" data-local-time="time"></time></dd></div>
  <div class="flex gap"><dt class="font-medium" style="min-inline-size: 6rem">date</dt><dd><time datetime="2026-10-11T22:20:21Z" data-local-time="date"></time></dd></div>
  <div class="flex gap"><dt class="font-medium" style="min-inline-size: 6rem">shortdate</dt><dd><time datetime="2026-10-11T22:20:21Z" data-local-time="shortdate"></time></dd></div>
  <div class="flex gap"><dt class="font-medium" style="min-inline-size: 6rem">datetime</dt><dd><time datetime="2026-10-11T22:20:21Z" data-local-time="datetime"></time></dd></div>
  <div class="flex gap"><dt class="font-medium" style="min-inline-size: 6rem">ago</dt><dd><time datetime="2026-10-11T22:15:21Z" data-local-time="ago"></time></dd></div>
</dl>

<script>
  // Demo only: point the timestamps at "now" and "five minutes ago".
  document.querySelectorAll("#local_time_demo time").forEach(time => {
    const offset = time.dataset.localTime === "ago" ? 5 * 60 * 1000 : 0
    time.setAttribute("datetime", new Date(Date.now() - offset).toISOString())
  })
</script>
