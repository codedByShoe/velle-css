<div class="flex items-center gap" role="group" aria-label="Email actions">
  <button type="button" class="btn btn--icon" aria-label="Go back">
    <span class="icon icon--chevron-left" aria-hidden="true"></span>
  </button>

  <div class="group" role="group" aria-label="Archive or report">
    <button type="button" class="btn">Archive</button>
    <button type="button" class="btn">Report</button>
  </div>

  <div class="group" role="group" aria-label="Snooze">
    <button type="button" class="btn">Snooze</button>
    <button type="button" class="btn btn--icon" aria-label="More options">
      <span class="icon icon--ellipsis" aria-hidden="true"></span>
    </button>
  </div>
</div>
