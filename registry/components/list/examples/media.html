<div class="list text-sm" style="max-inline-size: 24rem; --list-gap: var(--size-2)">
  <div class="list-row flex items-center gap">
    <img alt="" class="list-row__media" src="assets/images/landscape-1.svg">
    <div class="flex flex-1 flex-col">
      <h5 class="leading-none font-medium mbe-1">Mountains at dusk</h5>
      <p class="text-subtle">1920 × 1080 · 240 KB</p>
    </div>
    <button type="button" class="btn btn--icon btn--borderless" aria-label="Download">
      <span class="icon icon--download" aria-hidden="true"></span>
    </button>
  </div>

  <div class="list-row flex items-center gap">
    <span class="list-row__media flex items-center justify-center bg-shade">
      <span class="icon icon--camera" aria-hidden="true"></span>
    </span>
    <div class="flex flex-1 flex-col">
      <h5 class="leading-none font-medium mbe-1">Untitled photo</h5>
      <p class="text-subtle">Uploading…</p>
    </div>
    <span class="icon icon--loading" aria-hidden="true"></span>
  </div>
</div>
