<div class="list text-sm" style="max-inline-size: 24rem; --list-gap: var(--size-2)">
  <label class="list-row list-row--check flex items-start">
    <input type="checkbox" name="notifications" value="1" class="input" checked>
    <span class="flex flex-col mis-2">
      <span class="leading-none font-medium mbe-1">Enable notifications</span>
      <span class="text-subtle">You can turn notifications on or off at any time.</span>
    </span>
  </label>

  <label class="list-row list-row--check flex items-start">
    <input type="checkbox" name="newsletter" value="1" class="input">
    <span class="flex flex-col mis-2">
      <span class="leading-none font-medium mbe-1">Subscribe to the newsletter</span>
      <span class="text-subtle">One email a month, no spam.</span>
    </span>
  </label>
</div>
