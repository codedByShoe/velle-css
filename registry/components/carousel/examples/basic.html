<div class="carousel" data-carousel data-carousel-action="keydown.left->prev keydown.right->next" role="region" aria-roledescription="carousel" aria-label="Basic carousel">
  <button type="button" class="btn btn--icon" data-carousel-action="prev">
    <span class="icon icon--chevron-left" aria-hidden="true"></span>
    <span class="sr-only">Previous slide</span>
  </button>

  <div class="carousel__content" style="max-inline-size: 20rem" data-carousel-target="content" tabindex="-1">
    <div class="carousel__item">
      <div class="card flex items-center justify-center aspect-square" role="group" aria-roledescription="slide" aria-label="1 of 5">
        <span class="text-4xl leading-none font-semibold">1</span>
      </div>
    </div>
    <div class="carousel__item">
      <div class="card flex items-center justify-center aspect-square" role="group" aria-roledescription="slide" aria-label="2 of 5">
        <span class="text-4xl leading-none font-semibold">2</span>
      </div>
    </div>
    <div class="carousel__item">
      <div class="card flex items-center justify-center aspect-square" role="group" aria-roledescription="slide" aria-label="3 of 5">
        <span class="text-4xl leading-none font-semibold">3</span>
      </div>
    </div>
    <div class="carousel__item">
      <div class="card flex items-center justify-center aspect-square" role="group" aria-roledescription="slide" aria-label="4 of 5">
        <span class="text-4xl leading-none font-semibold">4</span>
      </div>
    </div>
    <div class="carousel__item">
      <div class="card flex items-center justify-center aspect-square" role="group" aria-roledescription="slide" aria-label="5 of 5">
        <span class="text-4xl leading-none font-semibold">5</span>
      </div>
    </div>
  </div>

  <button type="button" class="btn btn--icon" data-carousel-action="next">
    <span class="icon icon--chevron-right" aria-hidden="true"></span>
    <span class="sr-only">Next slide</span>
  </button>
</div>
