<div class="flex flex-col gap" style="max-inline-size: 24rem">
  <textarea rows="3" class="input" aria-label="Fixed size"></textarea>

  <textarea rows="auto" class="input" style="--input-rows: 3lh" aria-label="Auto sizing" placeholder="This textarea grows as you type"></textarea>

  <label class="input input--actor flex flex-col" rows="auto" style="--input-rows: 4lh">
    <textarea placeholder="Enter your message" aria-label="Message"></textarea>
    <span class="text-xs font-medium text-subtle mbs-1">120 characters left</span>
  </label>
</div>
