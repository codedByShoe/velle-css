<div class="flex flex-col gap text-sm">
  <div class="flex items-center gap">
    <input type="checkbox" id="input_terms" class="input" checked>
    <label for="input_terms">Accept terms and conditions</label>
  </div>

  <div class="flex items-center gap">
    <input type="checkbox" id="input_disabled_check" class="input" disabled>
    <label for="input_disabled_check" class="opacity-50">Disabled</label>
  </div>

  <fieldset class="flex flex-col gap-half">
    <legend class="font-medium mbe-2">Notify me about</legend>
    <div class="flex items-center gap">
      <input type="radio" name="notify" id="input_notify_all" value="all" class="input" checked>
      <label for="input_notify_all">All new messages</label>
    </div>
    <div class="flex items-center gap">
      <input type="radio" name="notify" id="input_notify_mentions" value="mentions" class="input">
      <label for="input_notify_mentions">Direct messages and mentions</label>
    </div>
    <div class="flex items-center gap">
      <input type="radio" name="notify" id="input_notify_none" value="none" class="input">
      <label for="input_notify_none">Nothing</label>
    </div>
  </fieldset>
</div>
