<div class="flex flex-col gap" style="max-inline-size: 20rem">
  <div class="flex flex-col gap-half">
    <label class="text-sm font-medium leading-none" for="input_text">Name</label>
    <input type="text" id="input_text" class="input" placeholder="Ada Lovelace">
  </div>
  <div class="flex flex-col gap-half">
    <label class="text-sm font-medium leading-none" for="input_email">Email</label>
    <input type="email" id="input_email" class="input" placeholder="ada@example.com">
  </div>
  <div class="flex flex-col gap-half">
    <label class="text-sm font-medium leading-none" for="input_number">Quantity</label>
    <input type="number" id="input_number" class="input" min="0" max="30" inputmode="numeric">
  </div>
  <div class="flex flex-col gap-half">
    <label class="text-sm font-medium leading-none" for="input_date">Date</label>
    <input type="date" id="input_date" class="input">
  </div>
  <div class="flex flex-col gap-half">
    <label class="text-sm font-medium leading-none" for="input_color">Color</label>
    <input type="color" id="input_color" class="input" style="--input-block-size: 2.25rem">
  </div>
</div>
