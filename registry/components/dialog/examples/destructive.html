<button type="button" class="btn btn--negative" commandfor="dialog_destructive" command="show-modal">Delete chat</button>

<dialog id="dialog_destructive" class="dialog" style="--dialog-size: 20rem;" role="alertdialog" aria-labelledby="dialog_destructive_title" aria-describedby="dialog_destructive_text">
  <div class="dialog__content">
    <div class="flex flex-col items-center">
      <div class="flex items-center justify-center flex-item-no-shrink p-2 rounded-md mbe-4 bg-negative text-negative">
        <span class="icon icon--circle-alert" style="--icon-size: 1.5rem" aria-hidden="true"></span>
      </div>

      <h2 class="font-medium leading-none text-center mbe-2" id="dialog_destructive_title">Delete chat?</h2>
      <p class="text-sm text-balance text-center text-subtle" id="dialog_destructive_text">
        This permanently deletes the conversation. Visit <a class="text-link" href="#">Settings</a> to delete saved memories.
      </p>
    </div>

    <div class="dialog__footer flex items-center gap mbs-4">
      <button type="button" class="btn flex-1" commandfor="dialog_destructive" command="close">Cancel</button>
      <button type="button" class="btn btn--negative flex-1" commandfor="dialog_destructive" command="close">Delete</button>
    </div>
  </div>
</dialog>
