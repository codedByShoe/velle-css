<button type="button" class="btn" commandfor="dialog_basic" command="show-modal">Edit profile</button>

<dialog id="dialog_basic" class="dialog" style="--dialog-size: 24rem;" data-dialog data-dialog-action="click->closeOnClickOutside" aria-labelledby="dialog_basic_title">
  <button type="button" class="btn btn--plain dialog__close" commandfor="dialog_basic" command="close">
    <span class="icon icon--x" aria-hidden="true"></span>
    <span class="sr-only">Close</span>
  </button>

  <form action="/profile" method="post" contents>
    <div class="dialog__content flex flex-col gap">
      <div class="flex flex-col">
        <h3 class="font-medium leading-none mbe-1" id="dialog_basic_title">Edit profile</h3>
        <p class="text-sm text-subtle">Make changes to your profile here. Click save when you're done.</p>
      </div>

      <div class="flex flex-col gap">
        <div class="flex flex-col gap-half">
          <label class="text-sm font-medium leading-none" for="dialog_basic_name">Name</label>
          <input value="Ada Lovelace" class="input" autofocus type="text" name="name" id="dialog_basic_name">
        </div>

        <div class="flex flex-col gap-half">
          <label class="text-sm font-medium leading-none" for="dialog_basic_username">Username</label>
          <input value="@ada" class="input" type="text" name="username" id="dialog_basic_username">
        </div>
      </div>

      <div class="dialog__footer flex items-center justify-end gap">
        <button type="button" class="btn" commandfor="dialog_basic" command="close">Cancel</button>
        <button type="submit" class="btn btn--primary">Save changes</button>
      </div>
    </div>
  </form>
</dialog>
