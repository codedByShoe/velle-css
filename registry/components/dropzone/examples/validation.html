<div class="dropzone" style="max-inline-size: 28rem" data-dropzone data-dropzone-max-files="3" data-dropzone-max-file-size="0.3" data-dropzone-size-message="Images must be 300 KB or smaller.">
  <label class="dropzone__area">
    <input type="file" name="images[]" accept="image/*" multiple class="sr-only" data-dropzone-target="input">
    <span class="font-medium">Drop images here or click to upload.</span>
    <span class="text-sm text-subtle">Up to 3 images, 300 KB each.</span>
  </label>
  <ul class="dropzone__files" data-dropzone-target="files"></ul>
</div>
