<form action="/settings" method="post" data-form data-form-action="change->submit">
  <div class="flex items-center gap">
    <input type="hidden" name="airplane_mode" value="0">
    <input class="switch" role="switch" type="checkbox" value="1" name="airplane_mode" id="form_airplane_mode">
    <label class="text-sm font-medium" for="form_airplane_mode">Airplane mode</label>
  </div>
</form>
