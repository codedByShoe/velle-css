<div class="list text-sm" style="max-inline-size: 24rem; --list-gap: var(--size-2)">
  <label class="list-row list-row--check flex items-start gap">
    <span class="flex flex-1 flex-col">
      <span class="leading-none font-medium mbe-1">Share across devices</span>
      <span class="text-subtle">Focus is shared across devices and turns off when you leave the app.</span>
    </span>
    <input type="checkbox" name="share_devices" value="1" class="switch" role="switch">
  </label>

  <label class="list-row list-row--check flex items-start gap">
    <span class="flex flex-1 flex-col">
      <span class="leading-none font-medium mbe-1">Enable notifications</span>
      <span class="text-subtle">Get notified when focus mode turns on or off.</span>
    </span>
    <input type="checkbox" name="notifications" value="1" checked class="switch" role="switch">
  </label>
</div>
