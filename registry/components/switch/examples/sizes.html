<div class="flex flex-col gap">
  <div class="flex items-center gap">
    <input type="checkbox" id="switch_small" class="switch switch--sm" role="switch">
    <label class="text-sm font-medium" for="switch_small">Small</label>
  </div>
  <div class="flex items-center gap">
    <input type="checkbox" id="switch_default" class="switch" role="switch">
    <label class="text-sm font-medium" for="switch_default">Default</label>
  </div>
  <div class="flex items-center gap">
    <input type="checkbox" id="switch_custom" class="switch" role="switch" style="--switch-size: var(--size-6)">
    <label class="text-sm font-medium" for="switch_custom">Custom</label>
  </div>
</div>
