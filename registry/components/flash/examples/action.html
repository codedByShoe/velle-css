<button type="button" class="btn" data-demo-flash="flash_action">Show flash</button>

<template id="flash_action">
  <div popover="manual" class="flash" data-flash data-flash-action="animationend->hide" role="alert">
    <div class="flash__content flex items-center gap">
      <div class="flex flex-col">
        <h5 class="font-medium leading-none mbe-1">Event has been created</h5>
        <p class="text-subtle text-balance">Sunday, December 03, 2023 at 9:00 AM</p>
      </div>
      <button type="button" class="btn btn--primary btn--xs mis-auto">Undo</button>
    </div>
  </div>
</template>
