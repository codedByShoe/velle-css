<button type="button" class="btn" data-demo-flash="flash_extended">Show flash</button>

<template id="flash_extended">
  <div popover="manual" class="flash flash--extended" data-flash data-flash-action="animationend->hide" role="alert">
    <div class="flash__content font-medium">This message stays for 12 seconds</div>
  </div>
</template>
