<div class="card flex flex-col gap" style="max-inline-size: 24rem" data-controller="toggle-class" data-toggle-class-toggle-class="bg-highlight">
  <p class="text-sm">The buttons add, remove or toggle the bg-highlight utility on this card.</p>
  <div class="flex items-center gap">
    <button type="button" class="btn" data-action="toggle-class#toggle">Toggle</button>
    <button type="button" class="btn" data-action="toggle-class#add">Add</button>
    <button type="button" class="btn" data-action="toggle-class#remove">Remove</button>
  </div>
</div>
