<div class="card flex flex-col gap" style="max-inline-size: 24rem" data-toggle-class="bg-highlight">
  <p class="text-sm">The buttons add, remove or toggle the bg-highlight utility on this card.</p>
  <div class="flex items-center gap">
    <button type="button" class="btn" data-toggle-class-action="toggle">Toggle</button>
    <button type="button" class="btn" data-toggle-class-action="add">Add</button>
    <button type="button" class="btn" data-toggle-class-action="remove">Remove</button>
  </div>
</div>
