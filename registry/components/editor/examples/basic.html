<form style="max-inline-size: 40rem">
  <div class="editor" data-editor data-editor-placeholder="Write something…">
    <div class="editor__toolbar" role="toolbar" aria-label="Formatting">
      <div class="editor__group" role="group" aria-label="Text">
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="bold" aria-label="Bold"><span class="icon icon--bold" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="italic" aria-label="Italic"><span class="icon icon--italic" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="underline" aria-label="Underline"><span class="icon icon--underline" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="strike" aria-label="Strikethrough"><span class="icon icon--strikethrough" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="code" aria-label="Code"><span class="icon icon--code" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="link" aria-label="Link"><span class="icon icon--link" aria-hidden="true"></span></button>
      </div>
      <div class="editor__group" role="group" aria-label="Blocks">
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="heading" data-editor-level-param="2" aria-label="Heading"><span class="icon icon--heading-2" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="heading" data-editor-level-param="3" aria-label="Subheading"><span class="icon icon--heading-3" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="bulletList" aria-label="Bulleted list"><span class="icon icon--list" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="orderedList" aria-label="Numbered list"><span class="icon icon--list-ordered" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="blockquote" aria-label="Quote"><span class="icon icon--text-quote" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="codeBlock" aria-label="Code block"><span class="icon icon--square-code" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="horizontalRule" aria-label="Divider"><span class="icon icon--minus" aria-hidden="true"></span></button>
      </div>
      <div class="editor__group" role="group" aria-label="History">
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="undo" aria-label="Undo"><span class="icon icon--undo-2" aria-hidden="true"></span></button>
        <button type="button" class="btn btn--borderless btn--icon-sm" data-editor-action="redo" aria-label="Redo"><span class="icon icon--redo-2" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="editor__content" data-editor-target="content"></div>
    <input type="hidden" name="body" value="&lt;h2&gt;Release notes&lt;/h2&gt;&lt;p&gt;This week we shipped &lt;strong&gt;faster search&lt;/strong&gt; and a &lt;a href=&quot;https://example.com&quot;&gt;new dashboard&lt;/a&gt;.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;&lt;p&gt;Filters remember your last choice&lt;/p&gt;&lt;/li&gt;&lt;li&gt;&lt;p&gt;Exports include attachments&lt;/p&gt;&lt;/li&gt;&lt;/ul&gt;" data-editor-target="input">
  </div>
</form>
