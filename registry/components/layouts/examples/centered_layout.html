<div class="centered-layout">
  <form class="card flex flex-col gap" style="inline-size: 100%; max-inline-size: 22rem" action="/session" method="post">
    <h1 class="font-bold text-2xl">Sign in</h1>
    <input type="email" required autocomplete="username" placeholder="Enter your email address" aria-label="Email" class="input">
    <input type="password" required autocomplete="current-password" placeholder="Enter your password" aria-label="Password" class="input">
    <div class="flex items-center gap">
      <button type="submit" class="btn btn--primary">Sign in</button>
      <a class="text-sm font-medium text-link" href="#">Forgot password?</a>
    </div>
  </form>
</div>
